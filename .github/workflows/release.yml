name: QEST Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Build linux/amd64 binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/qest-linux-amd64 ./cmd/qest

      - name: Build linux/arm64 binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/qest-linux-arm64 ./cmd/qest

      - name: Build darwin/amd64 binary
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o dist/qest-darwin-amd64 ./cmd/qest

      - name: Build darwin/arm64 binary
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o dist/qest-darwin-arm64 ./cmd/qest

      - name: Generate checksums
        run: |
          cd dist
          sha256sum qest-linux-amd64 > qest-linux-amd64.sha256
          sha256sum qest-linux-arm64 > qest-linux-arm64.sha256
          sha256sum qest-darwin-amd64 > qest-darwin-amd64.sha256
          sha256sum qest-darwin-arm64 > qest-darwin-arm64.sha256

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/qest-linux-amd64
            dist/qest-linux-amd64.sha256
            dist/qest-linux-arm64
            dist/qest-linux-arm64.sha256
            dist/qest-darwin-amd64
            dist/qest-darwin-amd64.sha256
            dist/qest-darwin-arm64
            dist/qest-darwin-arm64.sha256
