name: QEST CI

on:
  push:
  pull_request:

jobs:
  go-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Go build
        run: go build ./...
      - name: Go test
        run: go test ./...

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: shellcheck get.qest.sh qest.sh test_docker.sh scripts/*.sh tests/*.sh

  preset-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark scripts executable
        run: chmod +x qest.sh tests/preset_smoke.sh
      - name: Run preset dry-run smoke tests
        run: ./tests/preset_smoke.sh

  docker-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro: [ubuntu, fedora, arch]
    steps:
      - uses: actions/checkout@v4
      - name: Run distro integration test
        run: ./test_docker.sh "${{ matrix.distro }}"
