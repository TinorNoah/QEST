name: QEST CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: qest-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
      - name: Go fmt check
        run: test -z "$(gofmt -l .)"
      - name: Go vet
        run: go vet ./...
      - name: Validate tool manifests
        run: go run ./cmd/qest --validate-manifests
      - name: Go build
        run: go build ./...
      - name: Go test
        run: go test ./...

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: shellcheck get.qest.sh qest.sh test_docker.sh scripts/*.sh tests/*.sh

  preset-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
      - name: Mark scripts executable
        run: chmod +x get.qest.sh tests/preset_smoke.sh
      - name: Run preset dry-run smoke tests
        run: ./tests/preset_smoke.sh

  docker-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro: [ubuntu, fedora, arch]
    steps:
      - uses: actions/checkout@v5
      - name: Run distro integration test
        run: ./test_docker.sh "${{ matrix.distro }}"
